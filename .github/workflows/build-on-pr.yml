name: Build SThouse

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Print Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project SThouse.xcodeproj \
            -scheme SThouse \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
